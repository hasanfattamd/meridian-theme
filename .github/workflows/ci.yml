name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 2. Setup latest LTS Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: 3. Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 4. Run type check
        run: pnpm run typecheck

      - name: 5. Run lint
        run: pnpm run lint

      - name: 6. Run tests
        run: pnpm run test:coverage

      - name: 7 & 8. Build project & Generate theme
        # Our generator acts as both the builder and the emitter.
        run: pnpm run generate

      - name: 9. Verify the generated JSON exists
        run: |
          if [ ! -f themes/meridian-dark-color-theme.json ]; then
            echo "::error::Generated theme file was not found at expected path (themes/meridian-dark-color-theme.json)"
            exit 1
          fi
          echo "Theme file generated successfully."

      - name: 10. Upload generated theme as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-dark-theme
          path: themes/meridian-dark-color-theme.json
          retention-days: 7
          if-no-files-found: error
