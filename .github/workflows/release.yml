name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changelog generation

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Verify Version Consistency
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Git tag version (v$TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Build Theme JSON
        run: pnpm run build

      - name: Validate Theme
        run: pnpm run diagnose

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.vsix
            themes/*.json

      - name: Prepare Marketplace Publishing
        run: |
          echo "================================================="
          echo "🎉 VSIX Package Built and GitHub Release Created!"
          echo "================================================="
          echo "Automatic VS Code Marketplace publishing is intentionally disabled."
          echo "To publish, manually run:"
          echo "  npx @vscode/vsce publish"
          echo "Or configure the VSCE_PAT secret and uncomment the publish step in this workflow."
          echo "================================================="

      # - name: Publish to VS Code Marketplace
      #   run: npx @vscode/vsce publish
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
